[project]
name = "kofinex-api"
version = "0.1.0"
description = "KOFINEX — API FastAPI et moteurs métier"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.7",
  "email-validator>=2.2",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "pyjwt[crypto]>=2.10",
  "httpx>=0.28",
  "redis>=5.2",
  "celery>=5.4",
  "cryptography>=43",
  "python-multipart>=0.0.17",
  # importation : tableurs, PDF, OCR
  "openpyxl>=3.1",
  "xlrd>=2.0",            # .xls (Excel 97-2003)
  "pdfplumber>=0.11",     # PDF texte : mots positionnés et tableaux
  "pypdfium2>=4.30",      # rendu des pages numérisées pour l'OCR
  "pytesseract>=0.3.13",  # OCR (binaire tesseract + langue fra installés dans l'image)
  "pillow>=10.4",
  # phases suivantes (rapports)
  "pandas>=2.2",
  "python-docx>=1.1",
  "reportlab>=4.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.8", "mypy>=1.13", "pypdf>=5.0"]

# seul le paquet `app` est installé ; `alembic/` et `sql/` restent des dossiers du dépôt
[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "S"]
ignore = [
  "S101",   # assert (tests)
  "B008",   # Depends(...) dans les signatures FastAPI
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "E501"]
"alembic/**" = ["E501"]
# requêtes d'agrégation du grand livre : seuls des fragments constants du code (colonnes, clauses fixes) sont
# interpolés ; toute valeur venant de l'utilisateur passe par un paramètre lié
"app/services/ledger.py" = ["S608"]
